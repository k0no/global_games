<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка результата · Глобальные игры</title><link rel="stylesheet" href="style.css"><main class="admin"><div class="eyebrow">ГЛОБАЛЬНЫЕ ИГРЫ</div><h1>Проверка результата</h1><form><label for="code">Строка от игрока</label><textarea id="code" rows="5" required></textarea><button class="primary">Расшифровать</button></form><p id="out" role="status"></p></main><script src="codec.js"></script><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const out=document.querySelector('#out');try{const {id,scores}=await resultCodec.decode(document.querySelector('#code').value.trim());out.textContent='ID '+id+' · '+Object.entries(scores).map(([k,v])=>(k==='runner'?'Побег Антифриза':k==='race'?'Гонки на льду':k==='officeTime'?'Один в офисе · время':k==='office'?'Один в офисе (прежняя версия)':k)+' — '+displayResult(k,v)).join(' · ')}catch{out.textContent='Не удалось прочитать результат. Проверьте, что строка скопирована целиком.'}};</script></html>
